name: Vérifications
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-mpi-exercices
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: vscode-mpi-exercices
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mpi-informatique/exercices
          ref: 10bfbc037f01ff97158083616984e8b600528c66
          path: exercices
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop . -c npm ci
      - run: nix develop . -c npm test
      - run: nix develop . -c npm run package
