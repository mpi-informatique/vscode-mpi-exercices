name: Publication GitHub
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existant à publier, par exemple v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-mpi-exercices
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: vscode-mpi-exercices
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mpi-informatique/exercices
          ref: d80dd95c7adc63a6f2ec222e413698c8eeb848f1
          path: exercices
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Vérifier la version et son appartenance à main
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          nix develop . -c node scripts/check-release.mjs "$RELEASE_TAG"
      - run: nix develop . -c npm ci
      - run: nix develop . -c npm --prefix tp ci
      - run: nix develop . -c npm test
      - run: nix develop . -c npm --prefix tp test
      - run: xvfb-run -a nix develop . -c npm --prefix tp run test:integration
      - run: nix develop . -c npm run package
      - run: nix develop . -c npm --prefix tp run package
      - name: Préparer les deux VSIX avec des noms fixes
        run: |
          tp_version=$(nix develop . -c node -p 'require("./tp/package.json").version')
          cp "releases/vscode-mpi-exercices-${RELEASE_TAG#v}.vsix" releases/vscode-mpi-exercices.vsix
          cp "tp/releases/vscode-mpi-tp-$tp_version.vsix" releases/vscode-mpi-tp.vsix
      - name: Publier les deux VSIX dans une release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$RELEASE_TAG" releases/vscode-mpi-exercices.vsix releases/vscode-mpi-tp.vsix --clobber
            if [ "$draft" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" releases/vscode-mpi-exercices.vsix releases/vscode-mpi-tp.vsix --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
